services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ebarangay
      POSTGRES_PASSWORD: ebarangay
      POSTGRES_DB: ebarangay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebarangay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
