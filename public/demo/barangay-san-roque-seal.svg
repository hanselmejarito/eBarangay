<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sample seal for the demo barangay (Barangay San Roque, Quezon City).
  The ring inscriptions are laid out glyph by glyph on purpose: <textPath> is
  unsupported by several rasterisers, and fixed glyph positions keep the seal
  from reflowing when a viewer substitutes the serif.
-->
