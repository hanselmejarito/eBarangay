    <path id="ray" d="M0,-88 L-12,-46 L12,-46 Z" />
  </defs>

  <circle cx="256" cy="256" r="252" fill="#0038A8" />
  <circle cx="256" cy="256" r="245" fill="none" stroke="#FCD116" stroke-width="2.5" />
